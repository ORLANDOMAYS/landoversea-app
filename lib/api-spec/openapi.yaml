openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: LandOverSEA - International Dating & Cultural Connection API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: profiles
  - name: discover
  - name: matches
  - name: conversations
  - name: messages
  - name: premium
  - name: verification
  - name: coaches
  - name: bookings
  - name: payments
  - name: coaching-plans
  - name: group-workshops
  - name: cultural
  - name: language-learning
  - name: safety
  - name: notifications
  - name: admin
  - name: storage

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid registration input, including absent or false 18+ attestation
        "409":
          description: Email address is already registered

  /auth/providers:
    get:
      operationId: getAuthProviders
      tags: [auth]
      summary: Report which registration providers can currently be started
      responses:
        "200":
          description: Capability report; contains no credential values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviderCapabilities"

  /auth/social/{provider}/start:
    post:
      operationId: startSocialAuth
      tags: [auth]
      summary: Reserved social registration start path (not yet available)
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [apple, google, facebook]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialAuthStartInput"
      responses:
        "200":
          description: Reserved future success response; the route currently always returns 503
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialAuthStartResult"
        "503":
          description: Provider callback and session flow is not yet available

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/mobile/session:
    post:
      operationId: createMobileSession
      tags: [auth]
      summary: Create a bearer session for a trusted native client
      description: Returns a JWT for secure device storage after validating email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated native session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileAuthResponse"
        "401":
          description: Invalid credentials
        "403":
          description: Account restricted

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthenticated

  /auth/delete-account:
    delete:
      operationId: deleteAccount
      tags: [auth]
      summary: Delete current user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Password confirmation is missing
        "401":
          description: Password confirmation is incorrect

  /auth/account-deletion-requests:
    post:
      operationId: requestAccountDeletion
      tags: [auth]
      summary: Public, non-enumerating account-deletion assistance request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionRequestInput"
      responses:
        "202":
          description: Generic accepted response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionRequestResponse"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Generic accepted response (does not reveal account existence)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResponse"
        "503":
          description: Reset delivery is unavailable (no email channel configured)
        "500":
          description: Server error

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using a valid reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResponse"
        "400":
          description: Invalid, expired, or already-used token, or invalid password
        "503":
          description: Reset is temporarily unavailable
        "500":
          description: Server error

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify an email address using a one-time token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInput"
      responses:
        "200":
          description: Email verified or already verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyEmailResponse"
        "400":
          description: Token is missing, invalid, or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationErrorResponse"
        "410":
          description: Token has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationErrorResponse"
        "423":
          description: Token was locked after too many incorrect attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationErrorResponse"
        "429":
          description: Too many attempts from this IP
        "503":
          description: Verification is temporarily unavailable

  /auth/resend-verification:
    post:
      operationId: resendVerificationEmail
      tags: [auth]
      summary: Send a new email-verification token to the authenticated user
      responses:
        "200":
          description: Verification message accepted or account already verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendVerificationResponse"
        "429":
          description: Verification message was requested too recently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationErrorResponse"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationErrorResponse"
        "404":
          description: Authenticated user no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationErrorResponse"
        "503":
          description: Verification delivery provider is unavailable or rejected the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationErrorResponse"

  # ── PROFILES ──────────────────────────────────────────────────────────────
  /profiles/me:
    get:
      operationId: getMyProfile
      tags: [profiles]
      summary: Get current user's profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateMyProfile
      tags: [profiles]
      summary: Update current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Invalid or empty profile update

  /profiles/me/photos:
    post:
      operationId: uploadProfilePhoto
      tags: [profiles]
      summary: Upload a profile photo (multipart)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PhotoUploadInput"
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePhoto"
        "400":
          description: Missing file, unsupported image type, failed HEIC/HEIF conversion, or signature mismatch
        "413":
          description: Original or converted image is larger than 12 MB
        "409":
          description: Profile already has the maximum of six photos

  /profiles/me/photos/{photoId}:
    delete:
      operationId: deleteProfilePhoto
      tags: [profiles]
      summary: Delete a profile photo
      parameters:
        - name: photoId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
            multipleOf: 1
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid photo ID
        "404":
          description: Photo not found
    patch:
      operationId: reorderProfilePhoto
      tags: [profiles]
      summary: Reorder photo (set position)
      parameters:
        - name: photoId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
            multipleOf: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoReorderInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePhoto"
        "400":
          description: Invalid photo ID, body, or position
        "404":
          description: Photo not found

  /profiles/me/photos/{photoId}/primary:
    put:
      operationId: setPrimaryProfilePhoto
      tags: [profiles]
      summary: Set an owned profile photo as primary
      parameters:
        - name: photoId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
            multipleOf: 1
      responses:
        "200":
          description: Primary photo updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePhoto"
        "400":
          description: Invalid photo ID
        "404":
          description: Photo not found

  /profiles/me/voice-intro:
    post:
      operationId: uploadVoiceIntro
      tags: [profiles]
      summary: Upload voice intro audio
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/VoiceUploadInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    delete:
      operationId: deleteVoiceIntro
      tags: [profiles]
      summary: Delete voice intro
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /profiles/me/discovery-preferences:
    patch:
      operationId: updateDiscoveryPreferences
      tags: [profiles]
      summary: Update discovery preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryPreferencesInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /profiles/{userId}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get a public profile by user ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "404":
          description: Not found

  /profiles/completion:
    get:
      operationId: getProfileCompletion
      tags: [profiles]
      summary: Get profile completion status and missing steps
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileCompletion"

  # ── DISCOVER ──────────────────────────────────────────────────────────────
  /discover/cards:
    get:
      operationId: getDiscoverCards
      tags: [discover]
      summary: Get a batch of profiles to swipe on
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            default: 20
        - name: gender
          in: query
          schema:
            type: ["string", "null"]
        - name: minAge
          in: query
          schema:
            type: ["number", "null"]
        - name: maxAge
          in: query
          schema:
            type: ["number", "null"]
        - name: countries
          in: query
          schema:
            type: ["string", "null"]
            description: Comma-separated country codes
        - name: globalMode
          in: query
          schema:
            type: boolean
            default: true
        - name: languages
          in: query
          schema:
            type: ["string", "null"]
        - name: offset
          in: query
          schema:
            type: number
            default: 0
        - name: verifiedOnly
          in: query
          schema:
            type: boolean
        - name: relationshipGoal
          in: query
          schema:
            type: ["string", "null"]
        - name: longDistance
          in: query
          schema:
            type: boolean
        - name: relocation
          in: query
          schema:
            type: boolean
        - name: interestsOverlap
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscoverCard"

  /discover/swipe:
    post:
      operationId: swipe
      tags: [discover]
      summary: Like, pass, or superlike a profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwipeInput"
      responses:
        "200":
          description: OK — includes match info if mutual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwipeResult"
        "400":
          description: Invalid target, action, or self-swipe
        "403":
          description: A block exists between the users
        "404":
          description: Target user not found

  /discover/filters:
    get:
      operationId: getDiscoverFilters
      tags: [discover]
      summary: Get current discover filter settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverFilters"
    patch:
      operationId: updateDiscoverFilters
      tags: [discover]
      summary: Update discover filter settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverFiltersInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverFilters"

  # ── MATCHES ───────────────────────────────────────────────────────────────
  /matches:
    get:
      operationId: getMatches
      tags: [matches]
      summary: List mutual matches
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            default: 50
        - name: offset
          in: query
          schema:
            type: number
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"

  /matches/{matchId}:
    get:
      operationId: getMatch
      tags: [matches]
      summary: Get a specific match
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
    delete:
      operationId: unmatch
      tags: [matches]
      summary: Unmatch (delete match)
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /matches/stats:
    get:
      operationId: getMatchStats
      tags: [matches]
      summary: Match counts and activity stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchStats"

  # ── CONVERSATIONS ─────────────────────────────────────────────────────────
  /conversations:
    get:
      operationId: getConversations
      tags: [conversations]
      summary: List all conversations (direct + group)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

  /conversations/group:
    post:
      operationId: createGroupConversation
      tags: [conversations]
      summary: Create a group conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{conversationId}/members:
    post:
      operationId: addGroupMember
      tags: [conversations]
      summary: Add a member to a group (owner/admin only)
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{conversationId}/members/{userId}:
    delete:
      operationId: removeGroupMember
      tags: [conversations]
      summary: Remove a member from a group (owner/admin only)
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: number
        - name: userId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{conversationId}/members/{userId}/role:
    patch:
      operationId: setGroupMemberRole
      tags: [conversations]
      summary: Promote/demote a group member (owner only)
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: number
        - name: userId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMemberRoleInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{conversationId}/leave:
    post:
      operationId: leaveConversation
      tags: [conversations]
      summary: Leave a group conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /conversations/{conversationId}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get a conversation by ID
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{conversationId}/pin:
    patch:
      operationId: pinConversation
      tags: [conversations]
      summary: Pin or unpin a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{conversationId}/mute:
    patch:
      operationId: muteConversation
      tags: [conversations]
      summary: Mute or unmute a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MuteInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{conversationId}/read:
    post:
      operationId: markConversationRead
      tags: [conversations]
      summary: Mark all messages in conversation as read
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /conversations/{conversationId}/translation-preferences:
    patch:
      operationId: updateTranslationPreferences
      tags: [conversations]
      summary: Update the current participant's personal translation preference
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslationPreferenceInput"
      responses:
        "200":
          description: Viewer-scoped translation preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationPreference"
        "400":
          description: Invalid canonical target
        "403":
          description: Not a participant

  # ── MESSAGES ──────────────────────────────────────────────────────────────
  /conversations/{conversationId}/messages:
    get:
      operationId: getMessages
      tags: [messages]
      summary: List messages in a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: number
            default: 50
        - name: before
          in: query
          schema:
            type: string
            description: Stable ISO timestamp or ISO|messageId cursor for pagination
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

