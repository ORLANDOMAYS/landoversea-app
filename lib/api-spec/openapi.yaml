  /premium/native/reconcile:
    post:
      operationId: reconcileNativePremium
      tags: [premium]
      summary: Reconcile the authenticated user's native premium entitlement
      description: Requires a verified Supabase Bearer identity and queries RevenueCat server-side using los_user_<immutable Supabase UUID>. In every environment, an active Premium entitlement must be explicitly attached to a current access-granting App Store or Play Store subscription; RevenueCat Test Store, promotional, and unrelated subscription state are rejected. The request has no body; client entitlement, premium, receipt, and transaction claims are never accepted.
      responses:
        "200":
          description: Provider entitlement was verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativePremiumReconciliation"
        "403":
          description: The authenticated credential does not carry a valid attached Supabase subject
        "503":
          description: RevenueCat verification is temporarily unavailable; no entitlement assertion was accepted

