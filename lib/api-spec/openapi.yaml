components:
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: number
        contentType:
          type: string
        purpose:
          type: string
          description: >-
            Owner-bound upload purpose. One of photo, voice_intro, verification,
            coach_credential, attachment. For attachment, conversationId is required.
        conversationId:
          type: ["number", "null"]
          description: >-
            Required (positive) when purpose is attachment; binds the upload token
            to that conversation. Ignored for other purposes.

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        uploadToken:
          type: string
          description: >-
            Short-lived signed claim binding objectPath, uploader, purpose, and
            (for attachments) conversationId. Present it when registering the object.

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    # ── AUTH ──────────────────────────────────────────────────────────────
    RegisterInput:
      type: object
      required: [email, password, name, acceptedAgeRequirement]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        name:
          type: string
        acceptedAgeRequirement:
          type: boolean
          const: true
          description: Must be true to attest that the registering user is 18 or older.

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    DeleteAccountInput:
      type: object
      required: [confirmPassword]
      properties:
        confirmPassword:
          type: string

    AccountDeletionRequestInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 320

    AccountDeletionRequestResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    AccountDeletionRequest:
      type: object
      required: [id, emailHash, status, createdAt, updatedAt]
      properties:
        id:
          type: number
        userId:
          type: ["number", "null"]
        emailHash:
          type: string
        status:
          type: string
          enum: [pending, resolved, dismissed]
        resolvedBy:
          type: ["number", "null"]
        resolvedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AccountDeletionRequestUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [resolved, dismissed]

    AuthProviderCapability:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
        reason:
          type: ["string", "null"]

